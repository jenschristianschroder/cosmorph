name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Build and test backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore
      - run: dotnet test --configuration Release --no-build --logger "console;verbosity=normal"

  frontend:
    name: Build and test Observatory
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Cosmorph.Web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/Cosmorph.Web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  infrastructure:
    name: Validate infrastructure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Compile and lint Bicep
        run: |
          az bicep install
          az bicep build --file infra/main.bicep --outfile /tmp/main.json
          az bicep build-params --file infra/main.sample.bicepparam --outfile /tmp/main.parameters.json

  images:
    name: Build container images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Build the web/API image
        run: docker build -f src/Cosmorph.Api/Dockerfile -t cosmorph-api:ci .
      - name: Build the tick job image
        run: docker build -f src/Cosmorph.TickJob/Dockerfile -t cosmorph-tickjob:ci .
