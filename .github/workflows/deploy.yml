name: deploy

# Deployment is manual and environment-gated. Pull requests never deploy, so an untrusted fork
# cannot reach Azure. Authentication uses GitHub OIDC workload identity federation; no Azure
# credential is ever stored in this repository.

on:
  workflow_dispatch:
    inputs:
      environmentName:
        description: Environment name (for example dev or prod)
        required: true
        default: dev

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environmentName }}
  cancel-in-progress: false

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '10.0.x'
      - name: Assert sign-in is configured
        env:
          AUTH_TENANT_ID: ${{ vars.COSMORPH_AUTH_TENANT_ID }}
          AUTH_CLIENT_ID: ${{ vars.COSMORPH_AUTH_CLIENT_ID }}
        run: |
          # A production API refuses to start without these, and a container app that fails to start
          # wedges for roughly twenty minutes. Failing here costs seconds instead.
          if [ -z "$AUTH_TENANT_ID" ] || [ -z "$AUTH_CLIENT_ID" ]; then
            echo "COSMORPH_AUTH_TENANT_ID and COSMORPH_AUTH_CLIENT_ID must be set as repository or environment variables." >&2
            echo "Both are directory identifiers, not secrets; see docs/operations/ENTRA_APP_REGISTRATION.md." >&2
            exit 1
          fi
      - run: dotnet test --configuration Release

  infrastructure:
    name: Deploy infrastructure
    needs: verify
    runs-on: ubuntu-latest
    environment: ${{ inputs.environmentName }}
    permissions:
      contents: read
      id-token: write
    outputs:
      registryLoginServer: ${{ steps.deploy.outputs.registryLoginServer }}
      tickJobName: ${{ steps.deploy.outputs.tickJobName }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: What-if
        run: |
          az deployment group what-if \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/main.bicep \
            --parameters environmentName="${{ inputs.environmentName }}" \
                         modelEndpoint="${{ vars.COSMORPH_MODEL_ENDPOINT }}" \
                         modelDeployment="${{ vars.COSMORPH_MODEL_DEPLOYMENT }}" \
                         modelAccountName="${{ vars.COSMORPH_MODEL_ACCOUNT }}" \
                         authTenantId="${{ vars.COSMORPH_AUTH_TENANT_ID }}" \
                         authClientId="${{ vars.COSMORPH_AUTH_CLIENT_ID }}"
      - name: Deploy
        id: deploy
        run: |
          # Phase one: bootstrap image and no registry block. The runtimes' system-assigned
          # identities do not exist yet, so they cannot hold AcrPull and cannot pull from the
          # registry. This deployment is what creates those identities and grants them the role.
          az deployment group create \
            --name "cosmorph-${{ github.run_id }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/main.bicep \
            --parameters environmentName="${{ inputs.environmentName }}" \
                         modelEndpoint="${{ vars.COSMORPH_MODEL_ENDPOINT }}" \
                         modelDeployment="${{ vars.COSMORPH_MODEL_DEPLOYMENT }}" \
                         modelAccountName="${{ vars.COSMORPH_MODEL_ACCOUNT }}" \
                         authTenantId="${{ vars.COSMORPH_AUTH_TENANT_ID }}" \
                         authClientId="${{ vars.COSMORPH_AUTH_CLIENT_ID }}" \
                         useRegistryImages=false \
            --query properties.outputs -o json > outputs.json
          echo "registryLoginServer=$(jq -r '.registryLoginServer.value' outputs.json)" >> "$GITHUB_OUTPUT"
          echo "tickJobName=$(jq -r '.tickJobName.value' outputs.json)" >> "$GITHUB_OUTPUT"
      - name: Assert Storage hardening
        run: |
          account=$(az storage account list --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --query "[0].name" -o tsv)
          az storage account show --name "$account" --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query "{shared:allowSharedKeyAccess, publicBlob:allowBlobPublicAccess, network:publicNetworkAccess}" -o json > storage.json
          jq -e '.shared == false and .publicBlob == false and .network == "Disabled"' storage.json
          az network private-endpoint list --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query "[?contains(name, 'blob-pe')] | length(@)" -o tsv | grep -qv '^0$'

  images:
    name: Build and publish images
    needs: infrastructure
    runs-on: ubuntu-latest
    environment: ${{ inputs.environmentName }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Build images in the registry
        env:
          REGISTRY: ${{ needs.infrastructure.outputs.registryLoginServer }}
        run: |
          registry="${REGISTRY%%.*}"
          az acr build --registry "$registry" --image "cosmorph-api:${{ github.sha }}" --file src/Cosmorph.Api/Dockerfile .
          az acr build --registry "$registry" --image "cosmorph-tickjob:${{ github.sha }}" --file src/Cosmorph.TickJob/Dockerfile .

  applications:
    name: Roll out application images
    needs: [infrastructure, images]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environmentName }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Roll out the published images
        env:
          REGISTRY: ${{ needs.infrastructure.outputs.registryLoginServer }}
        run: |
          # Phase two: the images now exist and both identities hold AcrPull, so the template can
          # attach the registry, switch to the application port and enable the health probes.
          az deployment group create \
            --name "cosmorph-${{ github.run_id }}-apps" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/main.bicep \
            --parameters environmentName="${{ inputs.environmentName }}" \
                         modelEndpoint="${{ vars.COSMORPH_MODEL_ENDPOINT }}" \
                         modelDeployment="${{ vars.COSMORPH_MODEL_DEPLOYMENT }}" \
                         modelAccountName="${{ vars.COSMORPH_MODEL_ACCOUNT }}" \
                         authTenantId="${{ vars.COSMORPH_AUTH_TENANT_ID }}" \
                         authClientId="${{ vars.COSMORPH_AUTH_CLIENT_ID }}" \
                         useRegistryImages=true \
                         apiImage="$REGISTRY/cosmorph-api:${{ github.sha }}" \
                         tickJobImage="$REGISTRY/cosmorph-tickjob:${{ github.sha }}" \
            --query properties.outputs -o json
      - name: Assert the API is serving
        run: |
          fqdn=$(az containerapp show \
            --name "cosmorph-${{ inputs.environmentName }}-web" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query properties.configuration.ingress.fqdn -o tsv)
          curl --fail --silent --show-error --retry 10 --retry-delay 15 \
            --retry-all-errors "https://$fqdn/health/ready"
